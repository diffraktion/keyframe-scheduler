    /* App-specific layout on top of the LKL UI style guide.
       RULE: no colour literals here, only --lkl-* tokens. */

    p, h1, h2 { margin: 0; }

    body { padding: var(--lkl-space-5); }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--lkl-space-4);
    }

    /* ---- Header ------------------------------------------------------------ */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: var(--lkl-space-4);
      padding-bottom: var(--lkl-space-2);
    }
    .app-header .lkl-sub { margin-top: var(--lkl-space-1); }

    .app-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--lkl-space-4);
    }
    .control-group { display: flex; align-items: center; gap: var(--lkl-space-1); }
    .control-group-label {
      font-size: var(--lkl-fs-xs);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--lkl-text-3);
      margin-right: var(--lkl-space-1);
    }
    .lkl-chip.is-compact { padding: var(--lkl-space-1) var(--lkl-space-3); font-size: var(--lkl-fs-sm); }

    /* ---- Cards --------------------------------------------------------------- */
    .card-head { margin-bottom: var(--lkl-space-4); }
    .card-head .lkl-h2 { margin: 0; }

    .grid-3 {
      display: grid;
      gap: var(--lkl-space-4);
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .field { display: flex; flex-direction: column; }
    .field + .grid-3 { margin-top: var(--lkl-space-4); }
    .field-help {
      display: block;
      font-size: var(--lkl-fs-sm);
      line-height: var(--lkl-lh-tight);
      color: var(--lkl-text-3);
      margin-top: var(--lkl-space-1);
    }
    .field-help strong { color: var(--lkl-text-2); }

    /* Mono is for numbers only — free text gets the body face. */
    .lkl-input.is-text { font-family: var(--lkl-font); }
    .lkl-input.is-lg { font-size: var(--lkl-fs-lg); font-weight: 600; }

    .btn-row { display: flex; flex-wrap: wrap; gap: var(--lkl-space-2); }
    .spaced { margin-top: var(--lkl-space-4); }

    .lkl-btn.is-small { padding: var(--lkl-space-1) var(--lkl-space-2); }
    .lkl-btn.is-danger:hover {
      color: var(--lkl-danger);
      border-color: var(--lkl-danger-border);
      background: var(--lkl-danger-bg);
    }

    /* ---- Banners ------------------------------------------------------------- */
    .lkl-banner { line-height: var(--lkl-lh-base); }
    .lkl-banner strong { color: var(--lkl-text); font-weight: 600; }
    .lkl-banner code {
      font-family: var(--lkl-font-mono);
      font-size: var(--lkl-fs-sm);
      padding: 1px var(--lkl-space-2);
      border: 1px solid var(--lkl-border);
      border-radius: var(--lkl-radius-sm);
      background: var(--lkl-field);
      color: var(--lkl-text);
    }
    .lkl-banner .lkl-pill { margin: 2px var(--lkl-space-1) 2px 0; }

    /* ---- Keyframe table ------------------------------------------------------ */
    .keyframes-table td { vertical-align: middle; }
    .keyframes-table tbody tr { transition: opacity var(--lkl-dur); }
    .keyframes-table tbody tr:hover td { background: var(--lkl-surface-2); }
    .keyframes-table tbody tr.is-dragging { opacity: .5; }

    .keyframes-table .lkl-input,
    .keyframes-table .lkl-select {
      padding: var(--lkl-space-1) var(--lkl-space-2);
      font-size: var(--lkl-fs-md);
    }
    .keyframes-table input[type="time"]   { width: 104px; }
    .keyframes-table input[type="number"] { width: 84px; }
    .keyframes-table .hms input[type="number"] { width: 52px; }
    .keyframes-table .lkl-select { width: auto; min-width: 100px; }

    .keyframes-table td.is-inactive > * { opacity: .35; }

    .hms { display: flex; gap: var(--lkl-space-1); align-items: center; }
    .hms-sep { color: var(--lkl-text-3); }

    .drag-handle {
      cursor: grab;
      font-size: var(--lkl-fs-lg);
      color: var(--lkl-text-3);
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }

    .row-number { font-family: var(--lkl-font-mono); color: var(--lkl-text-3); }

    .empty-state {
      text-align: center;
      padding: var(--lkl-space-6) var(--lkl-space-4);
      color: var(--lkl-text-3);
    }

    /* ---- Chart & stats ------------------------------------------------------- */
    .chart-container { position: relative; height: 400px; }
    canvas { max-height: 100%; }

    .stat-grid {
      display: grid;
      gap: var(--lkl-space-3);
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    /* ---- JSON editor --------------------------------------------------------- */
    details { margin-top: var(--lkl-space-4); }
    summary {
      cursor: pointer;
      user-select: none;
      font-size: var(--lkl-fs-md);
      font-weight: 600;
      color: var(--lkl-text-2);
      padding: var(--lkl-space-2) 0;
      transition: color var(--lkl-dur);
    }
    summary:hover { color: var(--lkl-accent); }

    .json-box {
      display: block;
      width: 100%;
      min-height: 240px;
      margin-top: var(--lkl-space-2);
      line-height: var(--lkl-lh-base);
      color: var(--lkl-text);
      resize: vertical;
      outline: none;
    }
    .json-box:focus { border-color: var(--lkl-accent); box-shadow: 0 0 0 3px var(--lkl-focus); }

    @media (max-width: 768px) {
      body { padding: var(--lkl-space-3); }
      .grid-3 { grid-template-columns: 1fr; }
    }

    <header class="app-header">
      <div>
        <h1 class="lkl-h1">Keyframe Scheduler</h1>
        <p class="lkl-sub" id="subtitle-text">Erstelle dynamische Lichtsteuerung mit Farbtemperatur und Helligkeit</p>
      </div>
      <div class="app-controls">
        <div class="control-group">
          <span class="control-group-label" id="label-theme">Hell/Dunkel</span>
          <button class="lkl-chip is-compact" data-theme-k="theme" data-theme-v="day" id="themeDay">Tag</button>
          <button class="lkl-chip is-compact" data-theme-k="theme" data-theme-v="night" id="themeNight">Nacht</button>
          <button class="lkl-chip is-compact" data-theme-k="theme" data-theme-v="auto" id="themeAuto">Auto</button>
        </div>
        <div class="control-group">
          <span class="control-group-label" id="label-skin">Stil</span>
          <button class="lkl-chip is-compact" data-theme-k="skin" data-theme-v="glass" id="skinGlass">Glas</button>
          <button class="lkl-chip is-compact" data-theme-k="skin" data-theme-v="paper" id="skinPaper">Papier</button>
        </div>
        <div class="control-group">
          <button id="langDe" class="lkl-chip is-compact is-active" onclick="setLanguage('de')">DE</button>
          <button id="langEn" class="lkl-chip is-compact" onclick="setLanguage('en')">EN</button>
          <button id="langEs" class="lkl-chip is-compact" onclick="setLanguage('es')">ES</button>
        </div>
      </div>
    </header>

    <script>
    function switchLanguage(lang) {
      const filename = lang === 'en' ? 'webapp_en.html' : 'webapp.html';
      // For local files, replace the current filename
      const current = window.location.href;
      const lastSlash = current.lastIndexOf('/');
      const lastBackslash = current.lastIndexOf('\');
      const sep = Math.max(lastSlash, lastBackslash);
      if (sep > 0) {
        window.location.href = current.substring(0, sep + 1) + filename;
      } else {
        window.location.href = filename;
      }
    }
    </script>

    <!-- Settings Card -->
    <section class="lkl-card">

        <h2 class="lkl-h2" id="card-title-settings">Einstellungen</h2>
      </div>

      <!-- Schedule Name -->
      <div class="field">
        <label class="lkl-label" for="scheduleName" id="label-schedule-name">Schedule Name</label>
        <input class="lkl-input is-text is-lg" type="text" id="scheduleName" value="My Schedule"
               placeholder="My Schedule"
               maxlength="50"
               oninput="updateScheduleName(this.value)">
        <small class="field-help" id="help-schedule-name">
          Wird für JSON-Dateinamen und PDF-Titel verwendet
        </small>
      </div>

      <div class="grid-3">
        <div class="field">
          <label class="lkl-label" for="stepMinutes" id="label-step-minutes">Aktualisierung (Minuten)</label>
          <input class="lkl-input" type="number" id="stepMinutes" min="1" max="60" value="5">
          <small class="field-help" id="help-step-minutes"><!-- Filled by updateHelpTexts() --></small>
        </div>

        <div class="field">
          <label class="lkl-label" for="horizonHours" id="label-horizon-hours">Vorschau-Zeitraum</label>
          <select class="lkl-select" id="horizonHours">
            <option value="24" id="opt-24h">24 Stunden</option>
            <option value="48" selected id="opt-48h">48 Stunden</option>
            <option value="72" id="opt-72h">72 Stunden</option>
          </select>
        </div>

        <div class="field">
          <label class="lkl-label" for="wrapAround" id="label-wrap-around">Wiederholung</label>
          <select class="lkl-select" id="wrapAround">
            <option value="true" selected id="opt-repeat-daily">Täglich wiederholen</option>
            <option value="false" id="opt-repeat-once">Einmalig</option>
          </select>
        </div>
      </div>

      <div class="lkl-banner spaced" id="keyframe-tip"><!-- Filled by updateTip() --></div>
    </section>

    <!-- Keyframes Card -->
    <section class="lkl-card">
      <div class="card-head">
        <h2 class="lkl-h2" id="card-title-keyframes">Keyframes</h2>
      </div>

      <div class="btn-row">
        <button class="lkl-btn is-primary" id="addKeyframeBtn">Keyframe hinzufügen</button>
        <button class="lkl-btn" id="sortByTimeBtn">Nach Zeit sortieren</button>
        <button class="lkl-btn" id="loadPresetBtn">Beispiel laden</button>
        <button class="lkl-btn" id="loadFileBtn">Datei laden</button>
      </div>
      <input type="file" id="fileInputTop" accept=".json" hidden>

      <div id="keyframesContainer" class="spaced">
        <!-- Table will be inserted here -->
      </div>

      <div class="lkl-banner spaced" id="info-box">
        <!-- Will be populated by updateInfoBox() -->
      </div>
    </section>

    <!-- Chart Card -->
    <section class="lkl-card">
      <div class="card-head">
        <h2 class="lkl-h2" id="card-title-preview">Vorschau</h2>
      </div>

      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>

      <div class="stat-grid spaced" id="stats">
        <!-- Stats will be inserted here -->
      </div>

      <div class="btn-row spaced">
        <button class="lkl-btn" id="downloadCsvBtn">CSV Export</button>
      </div>
    </section>

    <!-- Export/Import Card -->
    <section class="lkl-card">
      <div class="card-head">
        <h2 class="lkl-h2" id="card-title-export">Export & Import</h2>
      </div>

      <div class="btn-row">
        <button class="lkl-btn is-primary" id="downloadJsonBtn">Als Datei speichern</button>
        <button class="lkl-btn" id="downloadPdfBtn">PDF Export</button>
      </div>

      <details>
        <summary id="json-summary">JSON anzeigen/bearbeiten</summary>
        <textarea id="jsonOutput" class="lkl-code json-box" readonly></textarea>
        <div class="btn-row spaced">
          <button class="lkl-btn is-small" id="importFromTextBtn">
            <span id="btn-import-json">JSON übernehmen</span>
          </button>
        </div>
      </details>

      <div class="lkl-banner spaced" id="workflow-box">
        <!-- Will be populated by updateWorkflowBox() -->
      </div>
    </section>
  </div>

      ]
    };

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const pad2 = n => String(n).padStart(2, '0');

    function parseTime(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function formatTime(minutes) {
      const h = Math.floor(minutes / 60) % 24;
      const m = minutes % 60;
      return `${pad2(h)}:${pad2(m)}`;
    }

    function easeSinus(t) {
      return (1 - Math.cos(Math.PI * clamp(t, 0, 1))) / 2;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = JSON.parse(saved);
          updateUI();
        } else {
          // Load example preset on first visit
          loadPreset('example');
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    function updateUI() {
      document.getElementById('stepMinutes').value = state.stepMinutes;
      document.getElementById('horizonHours').value = state.horizonHours;
      document.getElementById('wrapAround').value = state.wrapAround;
      document.getElementById('scheduleName').value = state.scheduleName || 'My Schedule';
      renderKeyframes();
      renderChart();
      updateJsonOutput();
    }
    
    function updateScheduleName(value) {
      state.scheduleName = value.trim() || 'My Schedule';
      saveState();
    }

    // ============================================================================
    // KEYFRAME MANAGEMENT
    // ============================================================================

    function addKeyframe() {
      const now = new Date();
      const time = `${pad2(now.getHours())}:00`;
      
      state.keyframes.push({
        time,
        kelvin: 4000,
        dim: 80,
        mode: 'instant',
        transitionSeconds: 300,
        transitionDirection: 'after',
        curve: 'linear'
      });
      
      saveState();
      updateUI();
    }

    function deleteKeyframe(index) {
      if (confirm('Keyframe wirklich löschen?')) {
        state.keyframes.splice(index, 1);
        saveState();
        updateUI();
      }
    }

    function updateKeyframe(index, field, value) {
      if (!state.keyframes[index]) return;
      
      if (field === 'kelvin') {
        value = clamp(parseInt(value) || 2000, 2000, 6500);
      } else if (field === 'dim') {
        value = clamp(parseInt(value) || 0, 0, 100);
      } else if (field === 'transitionSeconds') {
        const numValue = parseInt(value) || 0;
        // If negative value, convert to positive and set direction to "before"
        if (numValue < 0) {
          state.keyframes[index].transitionSeconds = Math.abs(numValue);
          state.keyframes[index].transitionDirection = 'before';
          saveState();
          updateUI();
          return;
        }
        value = Math.max(0, numValue);
      }
      
      state.keyframes[index][field] = value;
      saveState();
      
      // For text input fields: don't re-render table, only update chart/json
      // This preserves focus in input fields
      if (field === 'time' || field === 'kelvin' || field === 'dim') {
        // Debounced chart update to avoid too many updates while typing
        if (window.chartUpdateTimeout) clearTimeout(window.chartUpdateTimeout);
        window.chartUpdateTimeout = setTimeout(() => {
          renderChart();
          updateJsonOutput();
        }, 300); // Wait 300ms after last keystroke
      } else {
        // For dropdowns (mode, curve, direction): full update is OK
        updateUI();
      }
    }

    function updateTransitionTime(index, container) {
      const inputs = container.querySelectorAll('input[type="number"]');
      const hours = Math.max(0, Math.min(23, parseInt(inputs[0].value) || 0));
      const minutes = Math.max(0, Math.min(59, parseInt(inputs[1].value) || 0));
      const seconds = Math.max(0, Math.min(59, parseInt(inputs[2].value) || 0));
      
      const totalSeconds = hours * 3600 + minutes * 60 + seconds;
      
      state.keyframes[index].transitionSeconds = totalSeconds;
      saveState();
      updateUI();
    }

    function handleTransitionInput(index, inputElement) {
      const value = parseInt(inputElement.value);
      if (!isNaN(value) && value < 0) {
        // Live feedback: change direction dropdown immediately
        state.keyframes[index].transitionDirection = 'before';
      }
    }

    function sortKeyframesByTime() {
      state.keyframes.sort((a, b) => parseTime(a.time) - parseTime(b.time));
      saveState();
      updateUI();
    }

    function loadPreset(presetName) {
      if (PRESETS[presetName]) {
        state.keyframes = JSON.parse(JSON.stringify(PRESETS[presetName]));
        saveState();
        updateUI();
      }
    }

                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
                </svg>
              </button>
            </td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        </div>
      `;

      container.innerHTML = html;
      
      // Add drag and drop handlers
      setupDragAndDrop();
    }

    function setupDragAndDrop() {
      const rows = document.querySelectorAll('.keyframes-table tbody tr');
      let draggedIndex = null;

      rows.forEach((row, index) => {
        row.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          row.classList.add('is-dragging');
        });

        row.addEventListener('dragend', (e) => {
          row.classList.remove('is-dragging');
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        row.addEventListener('drop', (e) => {
          e.preventDefault();
          if (draggedIndex !== null && draggedIndex !== index) {
            const temp = state.keyframes[draggedIndex];
            state.keyframes.splice(draggedIndex, 1);
            state.keyframes.splice(index, 0, temp);
            saveState();
            updateUI();
          }
        });
      });
    }

    // ============================================================================
    // SCHEDULER LOGIC
    // ============================================================================

    function evaluateSchedule(timeMinutes) {
      if (state.keyframes.length === 0) {
        return { kelvin: 4000, dim: 50, transition: 300 };
      }

      // Sort by time for evaluation
      const sorted = [...state.keyframes].sort((a, b) => parseTime(a.time) - parseTime(b.time));
      
      // Find relevant keyframes
      let prevKf = null;
      let nextKf = null;

      for (let i = 0; i < sorted.length; i++) {
        const kfTime = parseTime(sorted[i].time);
        
        if (kfTime <= timeMinutes) {
          prevKf = { ...sorted[i], timeMinutes: kfTime, index: i };
        }
        
        if (kfTime > timeMinutes && !nextKf) {
          nextKf = { ...sorted[i], timeMinutes: kfTime, index: i };
        }
      }

      // Wrap around handling
      if (state.wrapAround) {
        if (!prevKf) {
          prevKf = { ...sorted[sorted.length - 1], timeMinutes: parseTime(sorted[sorted.length - 1].time) - 1440 };
        }
        if (!nextKf) {
          nextKf = { ...sorted[0], timeMinutes: parseTime(sorted[0].time) + 1440 };
        }
      }

      // No previous keyframe and no wrap
      if (!prevKf) {
        if (nextKf) {
          return { 
            kelvin: nextKf.kelvin, 
            dim: nextKf.dim, 
            transition: nextKf.transitionSeconds 
          };
        }
        return { kelvin: 4000, dim: 50, transition: 300 };
      }

      // Handle different modes
      if (prevKf.mode === 'instant') {
        return { 
          kelvin: prevKf.kelvin, 
          dim: prevKf.dim, 
          transition: prevKf.transitionSeconds 
        };
      }

      if (prevKf.mode === 'transition') {
        const direction = prevKf.transitionDirection || 'after';
        const transitionDuration = prevKf.transitionSeconds / 60; // in minutes
        
        let transitionStart, transitionEnd;
        
        if (direction === 'before') {
          transitionEnd = prevKf.timeMinutes;
          transitionStart = transitionEnd - transitionDuration;
        } else {
          transitionStart = prevKf.timeMinutes;
          transitionEnd = transitionStart + transitionDuration;
        }
        
        if (timeMinutes >= transitionStart && timeMinutes <= transitionEnd) {
          // During transition
          const t = (timeMinutes - transitionStart) / (transitionEnd - transitionStart);
          const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
          
          const beforeValue = evaluateSchedule(transitionStart - 0.1);
          
          return {
            kelvin: lerp(beforeValue.kelvin, prevKf.kelvin, progress),
            dim: lerp(beforeValue.dim, prevKf.dim, progress),
            transition: prevKf.transitionSeconds
          };
        }
        
        // After transition is complete
        if (timeMinutes >= transitionEnd) {
          // Check if NEXT keyframe is interpolate
          // If yes, interpolate to it from this transition's end
          const prevIndex = prevKf.index;
          
          // Find next interpolate keyframe
          let nextInterpolateKf = null;
          let nextInterpolateTime = null;
          
          for (let i = prevIndex + 1; i < sorted.length; i++) {
            if (sorted[i].mode === 'interpolate') {
              nextInterpolateKf = sorted[i];
              nextInterpolateTime = parseTime(nextInterpolateKf.time);
              break;
            }
          }
          
          // Wrap-around
          if (!nextInterpolateKf && state.wrapAround) {
            for (let i = 0; i < prevIndex; i++) {
              if (sorted[i].mode === 'interpolate') {
                nextInterpolateKf = sorted[i];
                nextInterpolateTime = parseTime(nextInterpolateKf.time) + 1440;
                break;
              }
            }
          }
          
          // If next is interpolate, interpolate to it
          if (nextInterpolateKf && timeMinutes < nextInterpolateTime) {
            const startTime = transitionEnd;
            const endTime = nextInterpolateTime;
            const duration = endTime - startTime;
            const elapsed = timeMinutes - startTime;
            const t = clamp(elapsed / duration, 0, 1);
            const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
            
            return {
              kelvin: lerp(prevKf.kelvin, nextInterpolateKf.kelvin, progress),
              dim: lerp(prevKf.dim, nextInterpolateKf.dim, progress),
              transition: state.stepMinutes * 60
            };
          }
          
          // No next interpolate or already past it - hold value
          return { 
            kelvin: prevKf.kelvin, 
            dim: prevKf.dim, 
            transition: prevKf.transitionSeconds 
          };
        }
      }

      if (prevKf.mode === 'interpolate') {
        // Interpolate: defines TARGET value at TARGET time
        // Interpolates from previous keyframe to THIS keyframe
        // THEN checks if next is also interpolate to continue
        
        const prevIndex = prevKf.index;
        
        // PART 1: Are we BEFORE this keyframe? Interpolate TO it
        if (timeMinutes < prevKf.timeMinutes) {
          // Find interpolation START point
          let startTime = 0;
          let startKelvin = prevKf.kelvin;
          let startDim = prevKf.dim;
          
          if (prevIndex > 0) {
            const beforeKf = sorted[prevIndex - 1];
            const beforeTime = parseTime(beforeKf.time);
            
            startKelvin = beforeKf.kelvin;
            startDim = beforeKf.dim;
            
            // If previous was transition, start after it ends
            if (beforeKf.mode === 'transition') {
              const transDuration = beforeKf.transitionSeconds / 60;
              const direction = beforeKf.transitionDirection || 'after';
              
              if (direction === 'after') {
                startTime = beforeTime + transDuration;
              } else {
                startTime = beforeTime;
              }
            } else {
              startTime = beforeTime;
            }
          }
          
          // Interpolate to THIS keyframe
          const endTime = prevKf.timeMinutes;
          const duration = endTime - startTime;
          
          if (duration <= 0) {
            return {
              kelvin: prevKf.kelvin,
              dim: prevKf.dim,
              transition: state.stepMinutes * 60
            };
          }
          
          const elapsed = timeMinutes - startTime;
          const t = clamp(elapsed / duration, 0, 1);
          const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
          
          return {
            kelvin: lerp(startKelvin, prevKf.kelvin, progress),
            dim: lerp(startDim, prevKf.dim, progress),
            transition: state.stepMinutes * 60
          };
        }
        
        // PART 2: We're AT or AFTER this keyframe
        // Check if NEXT keyframe is also interpolate
        if (!nextKf) {
          // No next keyframe - hold
          return {
            kelvin: prevKf.kelvin,
            dim: prevKf.dim,
            transition: prevKf.transitionSeconds
          };
        }
        
        // If next is NOT interpolate, hold until next keyframe
        if (nextKf.mode !== 'interpolate') {
          return {
            kelvin: prevKf.kelvin,
            dim: prevKf.dim,
            transition: prevKf.transitionSeconds
          };
        }
        
        // PART 3: Next is ALSO interpolate - continue interpolating
        const nextInterpolateTime = nextKf.timeMinutes;
        
        // Check for transitions/instants BETWEEN this and next
        let startTime = prevKf.timeMinutes;
        let startKelvin = prevKf.kelvin;
        let startDim = prevKf.dim;
        
        for (let i = prevIndex + 1; i < sorted.length; i++) {
          const kf = sorted[i];
          const kfTime = parseTime(kf.time);
          
          if (kfTime >= nextInterpolateTime) break;
          
          if (kf.mode === 'transition') {
            const transDuration = kf.transitionSeconds / 60;
            const direction = kf.transitionDirection || 'after';
            
            if (direction === 'after') {
              startTime = kfTime + transDuration;
            } else {
              startTime = kfTime;
            }
            startKelvin = kf.kelvin;
            startDim = kf.dim;
          } else if (kf.mode === 'instant') {
            startTime = kfTime;
            startKelvin = kf.kelvin;
            startDim = kf.dim;
          }
        }
        
        // Interpolate to next interpolate keyframe
        const endTime = nextInterpolateTime;
        
        if (timeMinutes < startTime) {
          return {
            kelvin: startKelvin,
            dim: startDim,
            transition: state.stepMinutes * 60
          };
        }
        
        if (timeMinutes >= endTime) {
          return {
            kelvin: nextKf.kelvin,
            dim: nextKf.dim,
            transition: state.stepMinutes * 60
          };
        }
        
        // During interpolation to next
        const duration = endTime - startTime;
        const elapsed = timeMinutes - startTime;
        const t = clamp(elapsed / duration, 0, 1);
        const progress = nextKf.curve === 'sinus' ? easeSinus(t) : t;
        
        return {
          kelvin: lerp(startKelvin, nextKf.kelvin, progress),
          dim: lerp(startDim, nextKf.dim, progress),
          transition: state.stepMinutes * 60
        };
      }

      return { 
        kelvin: prevKf.kelvin, 
        dim: prevKf.dim, 
        transition: prevKf.transitionSeconds 
      };
    }

    // ============================================================================
    // CHART
    // ============================================================================

    let chart = null;

    // Chart colours come from the LKL tokens on <html>, so the canvas follows
    // theme and skin like the rest of the page.
    function chartPalette() {
      const cs = getComputedStyle(document.documentElement);
      const token = name => cs.getPropertyValue(name).trim();
      return {
        accent: token('--lkl-accent'),
        accentRgb: token('--lkl-accent-rgb'),
        secondary: token('--lkl-text-2'),
        text: token('--lkl-text-2'),
        tick: token('--lkl-text-3'),
        grid: token('--lkl-border'),
        tooltipBg: token('--lkl-solid-1'),
        tooltipText: token('--lkl-text'),
        font: token('--lkl-font'),
        fontMono: token('--lkl-font-mono')
      };
    }

    function renderChart(options = {}) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const palette = chartPalette();

      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      const stepMinutes = Math.max(1, state.stepMinutes);
      const horizonMinutes = state.horizonHours * 60;
      
      // IMPORTANT: Chart uses higher resolution for visualization
      // User's stepMinutes is for HA update frequency, NOT chart resolution
      // Use 0.5 min (30 sec) for smooth chart, regardless of stepMinutes setting
      const chartStepMinutes = 0.5;
      const steps = Math.ceil(horizonMinutes / chartStepMinutes);

      const labels = [];
      const kelvinData = [];
      const dimData = [];
      const transitionData = [];
      const timeData = []; // Store actual time objects for tooltips
      
      // For normalized display (0-100%)
      const kelvinNormalizedData = [];
      const dimNormalizedData = [];

      // Calculate label frequency based on horizon
      // For 24h: show every 2 hours, for 48h: every 4 hours, for 72h: every 6 hours
      const labelInterval = state.horizonHours <= 24 ? 120 : state.horizonHours <= 48 ? 240 : 360;

      for (let i = 0; i <= steps; i++) {
        const minutes = i * chartStepMinutes;
        const time = new Date(startOfDay.getTime() + minutes * 60000);
        timeData.push(time);
        
        // Show label at calculated intervals
        const showLabel = minutes % labelInterval === 0;
        labels.push(showLabel ? time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '');

        const timeOfDay = (time.getHours() * 60 + time.getMinutes()) % 1440;
        const values = evaluateSchedule(timeOfDay);
        
        kelvinData.push(values.kelvin);
        dimData.push(values.dim);
        transitionData.push(values.transition);
        
        // Normalize Kelvin: 2000-6500 → 0-100%
        const kelvinNormalized = ((values.kelvin - 2000) / (6500 - 2000)) * 100;
        kelvinNormalizedData.push(kelvinNormalized);
        
        // Dim is already 0-100%
        dimNormalizedData.push(values.dim);
      }

      if (chart) {
        chart.destroy();
      }

      // Store these for grid callback
      const gridConfig = {
        chartStepMinutes: chartStepMinutes,
        labelInterval: labelInterval
      };

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: t('chart_brightness'),
              data: dimNormalizedData,
              borderColor: palette.accent,
              backgroundColor: `rgba(${palette.accentRgb}, 0.12)`,
              fill: 'origin',
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 4,
              yAxisID: 'y',
              tension: 0  // No smoothing - show actual data points
            },
            {
              // One accent per app: the second series is set apart by the
              // text step and a dash pattern, not by a second colour.
              label: t('chart_kelvin'),
              data: kelvinNormalizedData,
              borderColor: palette.secondary,
              backgroundColor: palette.secondary,
              borderDash: [6, 4],
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 4,
              yAxisID: 'y1',
              tension: 0  // No smoothing - show actual data points
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: options.animation === false ? false : undefined,
          color: palette.text,
          font: { family: palette.font },
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              labels: { color: palette.text, font: { family: palette.font }, boxHeight: 2 }
            },
            tooltip: {
              backgroundColor: palette.tooltipBg,
              titleColor: palette.tooltipText,
              bodyColor: palette.tooltipText,
              footerColor: palette.tooltipText,
              borderColor: palette.grid,
              borderWidth: 1,
              titleFont: { family: palette.font },
              bodyFont: { family: palette.fontMono },
              callbacks: {
                title: function(context) {
                  // Show exact time for the data point
                  const index = context[0].dataIndex;
                  const time = timeData[index];
                  return time.toLocaleString('de-DE', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    day: '2-digit',
                    month: '2-digit'
                  });
                },
                label: function(context) {
                  const index = context.dataIndex;
                  const datasetIndex = context.datasetIndex;
                  
                  if (datasetIndex === 0) {
                    // Dim dataset
                    return `Helligkeit: ${dimData[index].toFixed(1)}%`;
                  } else {
                    // Kelvin dataset
                    return `Kelvin: ${Math.round(kelvinData[index])} K`;
                  }
                },
                afterBody: function(context) {
                  // Show transition time
                  const index = context[0].dataIndex;
                  return [``, `Transition: ${transitionData[index]}s`];
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                maxRotation: 0,
                minRotation: 0,
                autoSkip: false,
                color: palette.tick,
                font: {
                  family: palette.fontMono,
                  size: 11
                }
              },
              border: { color: palette.grid },
              grid: {
                display: true,
                color: function(context) {
                  // Grid lines at label intervals
                  const index = context.index;
                  const minutes = index * gridConfig.chartStepMinutes;
                  if (minutes % gridConfig.labelInterval === 0) {
                    return palette.grid;
                  }
                  return 'transparent'; // Hide other grid lines
                }
              }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              title: {
                display: true,
                text: 'Helligkeit %',
                color: palette.tick
              },
              ticks: { color: palette.tick, font: { family: palette.fontMono } },
              border: { color: palette.grid },
              grid: { color: palette.grid },
              min: 0,
              max: 100
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              title: {
                display: true,
                text: 'Kelvin (normalisiert)',
                color: palette.tick
              },
              ticks: { color: palette.tick, font: { family: palette.fontMono } },
              border: { color: palette.grid },
              min: 0,
              max: 100,
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });

      // Update stats
      updateStats(kelvinData, dimData, transitionData);
    }

    function updateStats(kelvinData, dimData, transitionData) {
      const avgKelvin = Math.round(kelvinData.reduce((a, b) => a + b, 0) / kelvinData.length);
      const avgDim = Math.round(dimData.reduce((a, b) => a + b, 0) / dimData.length);
      const avgTransition = Math.round(transitionData.reduce((a, b) => a + b, 0) / transitionData.length);

      const stat = (labelKey, value) => `
        <div class="lkl-stat">
          <div class="lkl-stat-label">${t(labelKey).replace(/:$/, '')}</div>
          <div class="lkl-stat-value">${value}</div>
        </div>`;

      document.getElementById('stats').innerHTML =
        stat('stats_keyframes', state.keyframes.length) +
        stat('stats_kelvin', `${avgKelvin} K`) +
        stat('stats_brightness', `${avgDim} %`) +
        stat('stats_transition', `${avgTransition} s`);
    }

    // ============================================================================
    // EXPORT / IMPORT
    // ============================================================================

    function generateHaJson() {
      return {
        version: 1,
        name: state.scheduleName || 'My Schedule',  // Metadata: WebApp verwendet es für Dateinamen/Titel
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin",
        stepMinutes: state.stepMinutes,
        horizonHours: state.horizonHours,
        wrapAround: state.wrapAround,
        startDateTime: null,
        keyframes: state.keyframes.map(kf => {
          return {
            time: kf.time,
            kelvin: kf.kelvin,
            dim: kf.dim,
            mode: kf.mode,
            curve: kf.curve,
            transitionSeconds: kf.transitionSeconds,
            transitionDirection: kf.transitionDirection || 'after'
          };
        })
      };
    }

    function updateJsonOutput() {
      const json = generateHaJson();
      document.getElementById('jsonOutput').value = JSON.stringify(json, null, 2);
    }

    function downloadJson() {
      const json = JSON.stringify(generateHaJson(), null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      // Use schedule name for filename (sanitized)
      const safeName = (state.scheduleName || 'My Schedule')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      a.download = `${safeName}-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadCsv() {
      // Generate CSV with schedule values
      const stepMinutes = Math.max(1, state.stepMinutes);
      const horizonMinutes = state.horizonHours * 60;
      const chartStepMinutes = 0.5; // 30 second resolution
      const steps = Math.ceil(horizonMinutes / chartStepMinutes);
      
      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      // CSV Header
      let csv = 'Zeit,Kelvin,Helligkeit %,Transition (s)\n';
      
      // Generate data points
      for (let i = 0; i <= steps; i++) {
        const minutes = i * chartStepMinutes;
        const time = new Date(startOfDay.getTime() + minutes * 60000);
        const timeStr = time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const timeOfDay = (time.getHours() * 60 + time.getMinutes() + time.getSeconds() / 60) % 1440;
        const values = evaluateSchedule(timeOfDay);
        
        csv += `${timeStr},${Math.round(values.kelvin)},${Math.round(values.dim)},${values.transition}\n`;
      }
      
      // Download
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `keyframe-schedule-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Print forces paper on white: render the chart once with the day/paper
    // tokens, grab it, and restore the on-screen theme. All synchronous
    // (animation off), so the browser never paints the intermediate state.
    function captureChartForPrint() {
      const root = document.documentElement;
      const prev = { theme: root.dataset.theme, skin: root.dataset.skin };
      root.dataset.theme = 'day';
      root.dataset.skin = 'paper';
      renderChart({ animation: false });
      const img = document.getElementById('chart').toDataURL('image/png');
      root.dataset.theme = prev.theme;
      root.dataset.skin = prev.skin;
      renderChart({ animation: false });
      return img;
    }

    function downloadPdf() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      let yPos = 20;
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 15;
      
      // Title
      doc.setFontSize(18);
      doc.setFont(undefined, 'bold');
      // Use schedule name as title
      doc.text(state.scheduleName || t('pdf_title'), margin, yPos);
      yPos += 10;
      
      // Date
      doc.setFontSize(10);
      doc.setFont(undefined, 'normal');
      const locale = currentLang === 'de' ? 'de-DE' : currentLang === 'es' ? 'es-ES' : 'en-US';
      doc.text(`${t('pdf_created')} ${new Date().toLocaleDateString(locale)}`, margin, yPos);
      yPos += 15;
      
      // Keyframes Table
      doc.setFontSize(14);
      doc.setFont(undefined, 'bold');
      doc.text(t('pdf_keyframes_title'), margin, yPos);
      yPos += 5;
      
      const tableData = state.keyframes.map(kf => {
        const hours = Math.floor(kf.transitionSeconds / 3600);
        const mins = Math.floor((kf.transitionSeconds % 3600) / 60);
        const secs = kf.transitionSeconds % 60;
        const transStr = `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // Bei Interpolate: Transition-Werte ausgrauen/ausblenden
        const showTransition = kf.mode === 'transition';
        const transDisplay = showTransition ? transStr : '-';
        const curveDisplay = (kf.mode === 'interpolate' || kf.mode === 'transition') ? 
                             (kf.curve === 'sinus' ? t('curve_sinus') : t('curve_linear')) : 
                             '-';
        
        return [
          kf.time,
          `${kf.kelvin}K`,
          `${kf.dim}%`,
          kf.mode === 'instant' ? t('mode_instant') : kf.mode === 'transition' ? t('mode_transition') : t('mode_interpolate'),
          transDisplay,
          curveDisplay
        ];
      });
      
      doc.autoTable({
        startY: yPos,
        head: [[t('pdf_time'), t('pdf_kelvin'), t('pdf_brightness'), t('pdf_mode'), t('pdf_transition'), t('pdf_curve')]],
        body: tableData,
        margin: { left: margin, right: margin },
        styles: { fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [60, 90, 128], fontStyle: 'bold' },  // LKL accent blue (day)
        theme: 'striped'
      });
      
      yPos = doc.lastAutoTable.finalY + 15;
      
      // Chart
      if (yPos > 200) {
        doc.addPage();
        yPos = 20;
      }
      
      doc.setFontSize(14);
      doc.setFont(undefined, 'bold');
      doc.text(t('pdf_preview'), margin, yPos);
      yPos += 5;
      
      // Get chart as image
      const canvas = document.getElementById('chart');
      const chartImg = captureChartForPrint();
      const chartWidth = pageWidth - 2 * margin;
      const chartHeight = (chartWidth / canvas.width) * canvas.height;
      
      if (yPos + chartHeight > doc.internal.pageSize.getHeight() - 20) {
        doc.addPage();
        yPos = 20;
      }
      
      doc.addImage(chartImg, 'PNG', margin, yPos, chartWidth, chartHeight);
      yPos += chartHeight + 15;
      
      // Explanations
      doc.addPage();
      yPos = 20;
      
      doc.setFontSize(14);
      doc.setFont(undefined, 'bold');
      doc.text(t('pdf_explanations'), margin, yPos);
      yPos += 10;
      
      doc.setFontSize(10);
      doc.setFont(undefined, 'normal');
      
      const explanations = [
        { title: t('pdf_instant_title'), text: t('pdf_instant_desc') },
        { title: t('pdf_transition_title'), text: t('pdf_transition_desc') },
        { title: t('pdf_interpolate_title'), text: t('pdf_interpolate_desc') },
        { title: '', text: '' },
        { title: t('pdf_curves_title'), text: '' },
        { title: t('pdf_linear_title'), text: t('pdf_linear_desc') },
        { title: t('pdf_sinus_title'), text: t('pdf_sinus_desc') },
        { title: '', text: '' },
        { title: t('pdf_transition_time_title'), text: '' },
        { title: t('mode_interpolate'), text: t('pdf_interpolate_time_desc') },
        { title: `${t('mode_transition')}/${t('mode_instant')}`, text: t('pdf_transition_any_desc') }
      ];
      
      explanations.forEach(exp => {
        if (exp.title === '' && exp.text === '') {
          yPos += 5;
          return;
        }
        
        if (exp.title && !exp.text) {
          doc.setFont(undefined, 'bold');
          doc.text(exp.title, margin, yPos);
          doc.setFont(undefined, 'normal');
          yPos += 7;
          return;
        }
        
        if (exp.title) {
          doc.setFont(undefined, 'bold');
          doc.text(exp.title + ':', margin, yPos);
          doc.setFont(undefined, 'normal');
          yPos += 5;
        }
        
        const lines = doc.splitTextToSize(exp.text, pageWidth - 2 * margin - 5);
        lines.forEach(line => {
          if (yPos > doc.internal.pageSize.getHeight() - 20) {
            doc.addPage();
            yPos = 20;
          }
          doc.text(line, margin + (exp.title ? 5 : 0), yPos);
          yPos += 5;
        });
        
        yPos += 3;
      });
      
      // Save
      // Use schedule name for filename (sanitized)
      const safeName = (state.scheduleName || 'My Schedule')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      doc.save(`${safeName}-${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function importJson() {
      document.getElementById('fileInput').click();
    }

    function loadFileTop() {
      document.getElementById('fileInputTop').click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          
          if (json.version === 1 && json.keyframes) {
            state.scheduleName = json.name || 'My Schedule';  // Load name from JSON
            state.stepMinutes = json.stepMinutes || 5;
            state.horizonHours = json.horizonHours || 48;
            state.wrapAround = json.wrapAround !== false;
            state.keyframes = json.keyframes.map(kf => {
              return {
                time: kf.time,
                kelvin: kf.kelvin,
                dim: kf.dim,
                mode: kf.mode || 'instant',
                curve: kf.curve || 'linear',
                transitionSeconds: kf.transitionSeconds || 300,
                transitionDirection: kf.transitionDirection || 'after'
              };
            });
            
            saveState();
            updateUI();
            alert('✅ Zeitplan erfolgreich importiert!');
          } else {
            alert('❌ Ungültiges JSON-Format');
          }
        } catch (err) {
          console.error('Import error:', err);
          alert('❌ Fehler beim Importieren der Datei');
        }
      };
      reader.readAsText(file);
      
      // Reset file input
      event.target.value = '';
    }

    function importFromText() {
      try {
        const json = JSON.parse(document.getElementById('jsonOutput').value);
        
        if (json.version === 1 && json.keyframes) {
          state.stepMinutes = json.stepMinutes || 5;
          state.horizonHours = json.horizonHours || 48;
          state.wrapAround = json.wrapAround !== false;
          state.keyframes = json.keyframes.map(kf => {
            return {
              time: kf.time,
              kelvin: kf.kelvin,
              dim: kf.dim,
              mode: kf.mode || 'instant',
              curve: kf.curve || 'linear',
              transitionSeconds: kf.transitionSeconds || 300,
              transitionDirection: kf.transitionDirection || 'after'
            };
          });
          
          saveState();
          updateUI();
          alert('✅ JSON erfolgreich übernommen!');
        } else {
          alert('❌ Ungültiges JSON-Format');
        }
      } catch (err) {
        console.error('Import error:', err);
        alert('❌ Ungültiges JSON');
      }
    }

    // ============================================================================
    // EVENT LISTENERS
    // ============================================================================

    document.getElementById('stepMinutes').addEventListener('change', (e) => {
      state.stepMinutes = Math.max(1, Math.min(60, parseInt(e.target.value) || 5));
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('horizonHours').addEventListener('change', (e) => {
      state.horizonHours = parseInt(e.target.value);
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('wrapAround').addEventListener('change', (e) => {
      state.wrapAround = e.target.value === 'true';
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('addKeyframeBtn').addEventListener('click', addKeyframe);
    document.getElementById('sortByTimeBtn').addEventListener('click', sortKeyframesByTime);
    document.getElementById('loadPresetBtn').addEventListener('click', () => loadPreset('example'));
    document.getElementById('loadFileBtn').addEventListener('click', loadFileTop);
    document.getElementById('fileInputTop').addEventListener('change', handleFileImport);
    document.getElementById('downloadJsonBtn').addEventListener('click', downloadJson);
    document.getElementById('downloadPdfBtn').addEventListener('click', downloadPdf);
    document.getElementById('downloadCsvBtn').addEventListener('click', downloadCsv);
    document.getElementById('importFromTextBtn').addEventListener('click', importFromText);

    // ============================================================================
    // INITIALIZATION
    // ============================================================================

    function setupThemeControls() {
      const buttons = document.querySelectorAll('[data-theme-k]');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          lklTheme.set({ [btn.dataset.themeK]: btn.dataset.themeV });
        });
      });
      lklTheme.subscribe(resolved => {
        buttons.forEach(btn => {
          const k = btn.dataset.themeK;
          const current = k === 'theme' ? resolved.themePref : resolved[k];
          btn.classList.toggle('is-active', current === btn.dataset.themeV);
        });
        // Canvas does not inherit CSS — redraw with the new tokens
        if (chart) renderChart();
      });
    }

    loadState();
    setLanguage(currentLang);  // Initialize i18n
    setupThemeControls();
  </script>
</body>
</html>
